services:
  mlflow:
    container_name: mlflow
    build:
      context: .
    command:
      - bash
      - -c
      - "mlflow server --backend-store-uri postgresql://user:password@db:5432/mlflow --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
volumes:
  mlflow_data: